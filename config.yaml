# ============================================================
#  AutoTube AI - master configuration
#  Env vars override these values (see .env.example).
#  Anything secret belongs in .env / Android Keystore, NOT here.
# ============================================================

app:
  name: AutoTube AI
  # LOCAL | CLOUD | HYBRID  -> where heavy work runs
  mode: LOCAL
  workspace: ./workspace

timezone:
  default: Asia/Kolkata

youtube:
  upload_enabled: false          # master safety switch
  default_privacy: private       # private | unlisted | public
  # Upload for real, but never make anything visible.
  #
  # Pins privacy to private AND drops publishAt, so nothing is scheduled and
  # nothing self-publishes. This is the setting that makes dry_run: false safe
  # to verify with: uploads happen, subscribers see nothing. Turn it off only
  # when you actually intend to publish.
  force_private: true
  default_category_id: "27"      # 27 = Education, 28 = Science & Technology
  # Default daily API quota for a new Google Cloud project.
  daily_quota_units: 10000
  # Real costs from the official docs (units):
  quota_costs:
    search_list: 100
    videos_list: 1
    channels_list: 1
    video_insert: 1600
    thumbnail_set: 50
    captions_insert: 400
  made_for_kids: false
  # YouTube requires disclosure of realistic synthetic media.
  synthetic_disclosure: true

research:
  max_results_per_query: 25
  max_queries: 3                 # 3 x 100 units = 300 units per research run
  published_within_days: 90
  min_views: 5000
  region_code: IN
  relevance_language: en
  cache_ttl_hours: 12

scoring:
  # ViralScore weights - fully configurable (spec section 4).
  weights:
    view_velocity: 0.28
    engagement: 0.18
    recency: 0.14
    topic_momentum: 0.12
    channel_normalized: 0.16
    title_pattern: 0.07
    content_gap: 0.05
  breakout_ratio_threshold: 2.5  # views / expected-views-for-channel

content:
  # Gemini first, deliberately. Groq's inference is faster, but its free tier
  # is capped at 8,000 tokens PER MINUTE on the large models, and one ideas
  # call measured here spent the entire minute budget - so a single job
  # rate-limits itself repeatedly. Gemini's Flash free tier has far more
  # token headroom (~1,500 requests/day, high TPM), which matters more than
  # per-call latency when a job makes four to six calls back to back.
  # Swap them back if you upgrade to a paid Groq tier.
  # `ollama` is deliberately NOT in this list. Removing OLLAMA_HOST from .env
  # does not disable it - the provider defaults to http://127.0.0.1:11434 and
  # reports itself available whenever the daemon is running, so the ORDER is
  # the only real off switch. On a CPU-only host it costs 300s per call and
  # then times out, which is worse than the template builder. Add it back if
  # you have a GPU, or if you lose both hosted keys and want a local fallback.
  llm_provider_order: [gemini, groq, template]
  temperature: 0.85
  max_ideas: 10
  # One scene = one visual = one TTS call, so this bounds the cost of a single
  # video, not its length. 400 scenes is roughly a 30-minute video at normal
  # pacing. Raise it for longer videos; render time scales with it.
  max_scenes: 400
  # Above this many scenes the script is written section by section instead of
  # in one LLM call. A 3,000-word script does not fit in a single free-tier
  # response (6k-12k tokens/minute) and gets truncated mid-JSON.
  section_threshold: 20
  scenes_per_section: 10
  # Sectioned generation makes one LLM call per section, so a slow provider
  # multiplies. CPU-only ollama was measured at >10 min/call here: 14 sections
  # would be hours. The outline call is timed and the run bails out if the
  # projection exceeds this.
  section_time_budget_seconds: 600
  # Free-tier LLM limits are mostly per MINUTE, so when one is hit it is better
  # to wait than to fall through to a weaker provider. Measured on real keys:
  # one ideas call spent Groq's whole 8,000 tokens/minute budget, and Gemini
  # answered a transient 503 - and the pipeline degraded to CPU-only ollama
  # when 25 seconds of patience would have kept the good model.
  transient_retries: 3
  retry_backoff_seconds: 25
  fact_check_required_niches: [science, technology, finance, health, history, space, news]

tts:
  provider_order: [edge, piper, gtts]
  voice_gender: female
  # edge-tts voice ids. en-IN-NeerjaNeural = Indian English female.
  voice_map:
    en: en-US-AriaNeural
    en-IN: en-IN-NeerjaNeural
    hi: hi-IN-SwaraNeural
    ta: ta-IN-PallaviNeural
    te: te-IN-ShrutiNeural
    es: es-ES-ElviraNeural
  rate: "+8%"
  # Bounds for the automatic duration re-fit. The old limits allowed +42% and a
  # real run shipped at +35%, which sounds rushed. Beyond these the script is
  # the wrong length and the (blocking) duration check should say so, rather
  # than the delivery papering over it.
  rate_floor: 0.88
  rate_ceiling: 1.16
  pitch: "+0Hz"
  target_lufs: -14.0

visuals:
  # `pexels_video` is inserted ahead of these automatically when a Pexels key
  # is set (same key as the photos). Real footage is the difference between a
  # video and a narrated slideshow. Remove it from the order below to force
  # stills only.
  provider_order: [pexels_video, pexels, pixabay, ai_image, procedural]
  image_width: 1080
  image_height: 1920
  # Never reuse copyrighted YouTube footage - see CONTENT_POLICY.md
  allow_stock_apis: true
  # Which service generates the images.
  #
  #   pollinations  - keyless, free, no account. Painterly house style; it
  #                   will NOT produce flat-colour anime line art, whatever
  #                   the prompt says. This is the zero-cost default.
  #   huggingface   - needs HF_API_TOKEN. Verified to produce exactly the
  #                   look this was built for: FLUX.1-schnell returns clean
  #                   cel-shaded artwork, bold outlines, coherent faces, in
  #                   3-12 seconds.
  #
  #                   NOT free at volume. Measured on a free account: SEVEN
  #                   images, then HTTP 402. A 30-minute video needs about
  #                   three hundred. Running a channel on this means HF PRO or
  #                   pay-as-you-go credit - so it is off by default, and a
  #                   402 mid-job degrades to keyless rather than wrecking the
  #                   render.
  ai_image_backend: pollinations
  # Used by the huggingface backend. Ignored by pollinations.
  ai_image_model: black-forest-labs/FLUX.1-schnell
  pollinations_model: sana
  # Put AI generation AHEAD of stock photography.
  #
  # For an illustrated story this is the setting that matters. Stock is
  # sharper, but it cannot draw the same three children twice, and a
  # photograph dropped between two illustrations breaks the world the
  # narration is building. Leave it off for factual content, where a real
  # photograph of a real thing is worth more than a drawing of it.
  #
  # Generation is slow - measured 8 to 45 seconds per image, so a 30-minute
  # video is hours of generation. Turn this on for content where it pays.
  prefer_ai: false
  # Ask the model who recurs in the script and repeat their description in
  # every scene they appear in. Costs one extra LLM call per job.
  character_bible: true
  # Concurrency is what trips free-tier rate limits; 2 is the sweet spot.
  parallel: 2
  # ...and 1 for AI generation, which is limited by simultaneous requests
  # rather than by how many you make. At 2, one of every pair was refused.
  ai_parallel: 1
  transient_retries: 3
  retry_backoff_seconds: 5
  # Drop a provider for the rest of the job once it has failed this many
  # scenes AND at least this share of its attempts. Rate limiting is global to
  # the provider, not per scene: on a 71-scene video, retrying each scene cost
  # ~15s of backoff to be refused anyway. Pollinations measured ~50% refusals
  # under this load, which is why the trigger is a rate and not a streak.
  breaker_limit: 3
  breaker_failure_rate: 0.5
  # Child-directed scenes get purpose-built animated flashcards - a big
  # bouncing letter, the subject in a rounded card, chunky kid-legible type -
  # instead of a stock photo search. Set false to fall back to photos.
  # This is motion graphics, not character animation: it will look designed
  # rather than scraped, but it is not Cocomelon and does not pretend to be.
  kids_animation: true

video:
  default_resolution: 1080x1920
  longform_resolution: 1920x1080
  default_fps: 30
  crf: 19
  # x264 preset. 'fast' is ~2x quicker than 'medium' with a negligible
  # quality difference at CRF 19; use 'slow' only if you are archiving.
  preset: fast
  audio_bitrate: 192k
  # Music arrives normalised to -23 LUFS, so these are relative trims.
  music_volume_db: -9
  duck_music_db: -11
  sfx_volume_db: -4
  transition: fade
  transition_duration: 0.35
  # Clips per pre-stitch batch in the final render. One ffmpeg call cannot take
  # hundreds of inputs (Windows caps a command line at 32,767 chars), so long
  # videos are stitched in batches first. Cross-fading is duration-exact either
  # way, so captions stay in sync.
  render_segment_max: 40
  # Per-scene clips encoded at once. 0 = derive from the CPU count, leaving one
  # core for the API. Set it explicitly on a small cloud instance: the Oracle
  # Always Free Ampere shape is 2 cores since June 2026, and three concurrent
  # x264 encodes there are slower than two.
  render_parallel: 0
  kenburns: true
  # Set either to false for voice-only audio. The synthesised bed is a taste
  # call, not a requirement.
  music_enabled: true
  sfx_enabled: true
  hardware_accel: auto           # auto | none | nvenc | qsv | amf
  # Named style template (spec section 45). Leave empty to auto-select from
  # the niche + style text. One of: FAST_FACTS, TECH_NEWS,
  # SCIENCE_EXPLAINER, STORYTELLING, TOP_5, MYSTERY, KIDS_STORY,
  # EDUCATIONAL, MOTIVATIONAL
  style_template: ""

captions:
  enabled: true
  style: karaoke                 # karaoke | block | none
  font: Arial Black
  font_size: 112
  primary_color: "&H00FFFFFF"
  highlight_color: "&H0000E5FF"
  outline: 7
  shadow: 3
  # Shorts-safe margins (fraction of height) - avoids YouTube UI overlays.
  safe_top: 0.12
  safe_bottom: 0.22
  max_words_on_screen: 3
  max_chars_on_screen: 20
  uppercase: true

quality:
  minimum_score: 80
  max_silence_seconds: 1.6
  min_audio_rms_db: -40.0
  duration_tolerance_pct: 25
  # Re-synthesise the narration at a corrected speaking rate once measured
  # duration drifts this far from the target. Measured cost of that extra pass:
  # ~50s on a 45s Short, ~4 min on a 4-minute video - cheap enough that being
  # strict is worth it. A "45 second" video delivered at 49.3s is wrong.
  refit_pct: 8
  longform_refit_pct: 7

originality:
  # Max 4-gram Jaccard similarity allowed against any researched text.
  max_similarity: 0.30

automation:
  approval_required: true        # APPROVAL MODE is the default (spec section 24)
  daily_video_limit: 3
  max_retries: 3
  retry_backoff_seconds: 20
  # Anti-spam (spec section 46)
  duplicate_similarity_threshold: 0.80
  stop_after_similar_videos: 3

dry_run: true                    # no upload, full artifact generation
