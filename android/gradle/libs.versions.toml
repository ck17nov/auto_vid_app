[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
workManager = "2.10.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
securityCrypto = "1.0.0"
appauth = "0.11.1"
media3 = "1.5.0"
datastore = "1.1.1"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
